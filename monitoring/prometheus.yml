global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: linkup_backend
    static_configs:
      - targets: ["backend:8000"]
    metrics_path: /metrics

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: linkup_workers
    static_configs:
      - targets:
          - "notification-worker:9091"
          - "task-worker:9092"
          - "ai-worker:9093"
    metrics_path: /metrics
