services:
  # --- Database: PostgreSQL + PostGIS ---
  db:
    image: postgis/postgis:15-3.3
    container_name: linkup_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - linkup_network

  # --- Cache & Pub/Sub: Redis ---
  # DB 0 → backend + outbox-worker
  # DB 1 → chat-ws (pub/sub) + outbox-worker (chat completion listener)
  redis:
    image: redis/redis-stack:7.2.0-v10 # גרסה קבועה, לא latest
    container_name: linkup_redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - linkup_network

  # --- Message Broker: RabbitMQ ---
  rabbitmq:
    image: rabbitmq:3-management
    container_name: linkup_rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672" # AMQP
      - "15672:15672" # ממשק ניהול גרפי
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq # שומר queues בין restarts
    networks:
      - linkup_network

  # --- Email Renderer: React Email (Node) ---
  email-renderer:
    build:
      context: ./email-renderer
      target: production
    container_name: linkup_email_renderer
    restart: unless-stopped
    environment:
      - PORT=3001
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - linkup_network

  # --- DB Migration — רץ פעם אחת לפני backend ו-outbox-worker ---
  migrate:
    build:
      context: ./backend
      target: migrate
    container_name: linkup_migrate
    env_file:
      - ./backend/.env
    environment:
      - POSTGRES_HOST=db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - linkup_network
    restart: "no"

  # --- Outbox & Notifications Worker ---
  outbox-worker:
    build:
      context: ./backend
      target: worker
    container_name: linkup_outbox_worker
    env_file:
      - ./backend/.env
    environment:
      - POSTGRES_HOST=db
      - REDIS_HOST=redis
      - REDIS_DB=0 # מפורש: DB 0 לbackend
      - REDIS_CHAT_DB=1 # listener לאירועי סיום שיחה
      - RABBITMQ_HOST=rabbitmq
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      email-renderer:
        condition: service_healthy
    networks:
      - linkup_network
    restart: unless-stopped
    volumes:
      - ./backend/app/infrastructure/firebase_core/firebase-credentials.json:/app/infrastructure/firebase_core/firebase-credentials.json:ro

  # --- Backend: FastAPI ---
  backend:
    build:
      context: ./backend
      target: development
    container_name: linkup_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - POSTGRES_HOST=db
      - REDIS_HOST=redis
      - REDIS_DB=0 # מפורש: DB 0 לbackend
      - REDIS_CHAT_DB=1 # אותו DB כמו chat-ws — Pub/Sub אירועי משתמש/צ'אט
      - RABBITMQ_HOST=rabbitmq
      - DOCKER_MODE=true
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      email-renderer:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - ./backend/app/infrastructure/firebase_core/firebase-credentials.json:/app/infrastructure/firebase_core/firebase-credentials.json:ro
    ports:
      - "8000:8000" # פיתוח: Vite על המחשב → proxy ל-localhost:8000
    networks:
      - linkup_network

  # --- WebSocket: Chat (Go) ---
  # JWT_SECRET חייב להיות זהה לזה שב-backend/.env
  chat-ws:
    build:
      context: ./chat-ws
      dockerfile: Dockerfile
    container_name: linkup_chat_ws
    restart: unless-stopped
    # פיתוח: 8081 ל-host — Vite proxy (ws + /presence) → localhost:8081
    ports:
      - "8081:8081"
    env_file:
      - ./chat-ws/.env
    environment:
      - PORT=8081
      - BACKEND_URL=http://backend:8000
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - linkup_network

  # --- Frontend: static build (production profile only) ---
  frontend:
    profiles: ["prod"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: linkup_frontend
    restart: unless-stopped
    networks:
      - linkup_network

  # --- Reverse proxy: פורט 80 בלבד החוצה ---
  nginx:
    profiles: ["prod"]
    image: nginx:1.25-alpine
    container_name: linkup_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
      chat-ws:
        condition: service_started
    networks:
      - linkup_network

networks:
  linkup_network:
    driver: bridge

volumes:
  postgres_data:
  rabbitmq_data:
