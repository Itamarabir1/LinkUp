services:
  # --- Database: PostgreSQL + PostGIS ---
  db:
    image: postgis/postgis:15-3.3
    container_name: linkup_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - linkup_network

  # --- Connection Pooler: PgBouncer (internal only) ---
  pgbouncer:
    image: pgbouncer/pgbouncer:1.24.1
    container_name: linkup_pgbouncer
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./infrastructure/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./infrastructure/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - linkup_network

  # --- Cache & Pub/Sub: Redis HA (Primary + Replica + Sentinel) ---
  # DB 0 -> backend + compatibility outbox-worker
  # DB 1 -> chat-ws pub/sub + chat completion listener
  redis-primary:
    image: redis/redis-stack:7.2.0-v10
    container_name: linkup_redis_primary
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      linkup_network:
        aliases:
          - redis

  redis-replica:
    image: redis:7.2-alpine
    container_name: linkup_redis_replica
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--replicaof",
        "redis-primary",
        "6379",
        "--masterauth",
        "${REDIS_PASSWORD}",
        "--requirepass",
        "${REDIS_PASSWORD}",
      ]
    depends_on:
      redis-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - linkup_network

  redis-sentinel:
    image: redis:7.2-alpine
    container_name: linkup_redis_sentinel
    restart: unless-stopped
    command:
      [
        "sh",
        "-c",
        "sed 's|\\${REDIS_PASSWORD}|'\"$REDIS_PASSWORD\"'|g' /etc/redis/sentinel.conf > /tmp/sentinel.conf && redis-server /tmp/sentinel.conf --sentinel",
      ]
    volumes:
      - ./infrastructure/redis/sentinel.conf:/etc/redis/sentinel.conf:ro
    depends_on:
      redis-primary:
        condition: service_healthy
      redis-replica:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "sentinel", "masters"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - linkup_network

  # --- Message Broker: RabbitMQ ---
  rabbitmq:
    image: rabbitmq:3-management
    container_name: linkup_rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672" # AMQP
      - "15672:15672" # management UI
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq # persist queues across restarts
    networks:
      - linkup_network

  # --- Email Renderer: React Email (Node) ---
  email-renderer:
    build:
      context: ./email-renderer
      target: production
    container_name: linkup_email_renderer
    restart: unless-stopped
    environment:
      - PORT=3001
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - linkup_network

  # --- DB migration: runs once before backend/workers ---
  migrate:
    build:
      context: ./backend
      target: migrate
    container_name: linkup_migrate
    env_file:
      - ./backend/.env
    environment:
      - POSTGRES_HOST=db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - linkup_network
    restart: "no"

  # --- Notification Worker (notifications consumer + outbox dispatcher) ---
  notification-worker:
    build:
      context: ./backend
      target: worker
    command: python -m app.workers.notification_worker
    container_name: linkup_notification_worker
    env_file:
      - ./backend/.env
    environment:
      - POSTGRES_HOST=pgbouncer
      - REDIS_HOST=redis
      - REDIS_SENTINEL_HOST=redis-sentinel
      - REDIS_DB=0
      - REDIS_CHAT_DB=1
      - RABBITMQ_HOST=rabbitmq
      - DB_POOL_SIZE=3
      - DB_MAX_OVERFLOW=5
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis-primary:
        condition: service_healthy
      redis-sentinel:
        condition: service_healthy
      email-renderer:
        condition: service_healthy
    networks:
      - linkup_network
    restart: unless-stopped

  # --- Task Worker (avatar + scheduled tasks) ---
  task-worker:
    build:
      context: ./backend
      target: worker
    command: python -m app.workers.task_worker
    container_name: linkup_task_worker
    env_file:
      - ./backend/.env
    environment:
      - POSTGRES_HOST=pgbouncer
      - REDIS_HOST=redis
      - REDIS_SENTINEL_HOST=redis-sentinel
      - REDIS_DB=0
      - REDIS_CHAT_DB=1
      - RABBITMQ_HOST=rabbitmq
      - DB_POOL_SIZE=3
      - DB_MAX_OVERFLOW=3
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis-primary:
        condition: service_healthy
      redis-sentinel:
        condition: service_healthy
    networks:
      - linkup_network
    restart: unless-stopped

  # --- AI Worker (chat completion listener) ---
  ai-worker:
    build:
      context: ./backend
      target: worker
    command: python -m app.workers.ai_worker
    container_name: linkup_ai_worker
    env_file:
      - ./backend/.env
    environment:
      - POSTGRES_HOST=pgbouncer
      - REDIS_HOST=redis
      - REDIS_SENTINEL_HOST=redis-sentinel
      - REDIS_DB=0
      - REDIS_CHAT_DB=1
      - DB_POOL_SIZE=3
      - DB_MAX_OVERFLOW=3
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis-primary:
        condition: service_healthy
      redis-sentinel:
        condition: service_healthy
    networks:
      - linkup_network
    restart: unless-stopped

  # --- Temporary compatibility alias (opt-in profile) ---
  outbox-worker:
    profiles: ["compat"]
    build:
      context: ./backend
      target: worker
    command: python -m app.workers.notification_worker
    container_name: linkup_outbox_worker
    env_file:
      - ./backend/.env
    environment:
      - POSTGRES_HOST=pgbouncer
      - REDIS_HOST=redis
      - REDIS_SENTINEL_HOST=redis-sentinel
      - REDIS_DB=0
      - REDIS_CHAT_DB=1
      - RABBITMQ_HOST=rabbitmq
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis-primary:
        condition: service_healthy
      redis-sentinel:
        condition: service_healthy
      email-renderer:
        condition: service_healthy
    networks:
      - linkup_network
    restart: unless-stopped

  # --- Backend: FastAPI ---
  backend:
    build:
      context: ./backend
      target: development
    container_name: linkup_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - POSTGRES_HOST=pgbouncer
      - REDIS_HOST=redis
      - REDIS_SENTINEL_HOST=redis-sentinel
      - REDIS_DB=0 # explicit: DB 0 for backend
      - REDIS_CHAT_DB=1 # same DB as chat-ws for chat/user pubsub
      - RABBITMQ_HOST=rabbitmq
      - DOCKER_MODE=true
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis-primary:
        condition: service_healthy
      redis-sentinel:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      email-renderer:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    ports:
      - "8000:8000" # dev: local Vite proxies to localhost:8000
    networks:
      - linkup_network

  # --- WebSocket: Chat (Go) ---
  # JWT_SECRET must match backend/.env
  chat-ws:
    build:
      context: ./chat-ws
      dockerfile: Dockerfile
    container_name: linkup_chat_ws
    restart: unless-stopped
    # dev: expose 8081; Vite proxies ws + /presence to localhost:8081
    ports:
      - "8081:8081"
    env_file:
      - ./chat-ws/.env
    environment:
      - PORT=8081
      - BACKEND_URL=http://backend:8000
      - REDIS_MASTER_NAME=mymaster
      - REDIS_SENTINEL_ADDR=redis-sentinel:26379
    depends_on:
      redis-primary:
        condition: service_healthy
      redis-sentinel:
        condition: service_healthy
    networks:
      - linkup_network

  # --- Monitoring: Prometheus ---
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v2.51.0
    container_name: linkup_prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - linkup_network
    restart: unless-stopped

  # --- Monitoring: Grafana ---
  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:10.4.0
    container_name: linkup_grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3002:3000"
    depends_on:
      - prometheus
    networks:
      - linkup_network
    restart: unless-stopped

  # --- Frontend: static build (production profile only) ---
  frontend:
    profiles: ["prod"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: linkup_frontend
    restart: unless-stopped
    networks:
      - linkup_network

  # --- Reverse proxy: expose ports 80/443 ---
  nginx:
    profiles: ["prod"]
    image: nginx:1.25-alpine
    container_name: linkup_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
      chat-ws:
        condition: service_started
    networks:
      - linkup_network

networks:
  linkup_network:
    driver: bridge

volumes:
  postgres_data:
  rabbitmq_data:
  grafana_data:
