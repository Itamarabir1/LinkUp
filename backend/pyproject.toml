[project]
name = "linkup-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # --- Core Framework ---
    "fastapi",
    "uvicorn[standard]",
    "gunicorn",
    "pydantic[email]>=2.13.3",
    "pydantic-settings>=2.1.0",
    "python-dotenv",
    "httpx>=0.27.0",
    # --- Database & Geo ---
    "SQLAlchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.19.0",
    "psycopg2-binary>=2.9.9",
    "GeoAlchemy2>=0.14.0",
    "alembic>=1.18.0",
    "shapely>=2.0.0",
    "geopy>=2.4.0",
    # --- Authentication & Security ---
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",
    "itsdangerous==2.1.2",
    "google-auth>=2.23.0",
    "google-auth-oauthlib>=1.1.0",
    # --- Messaging & Infrastructure ---
    "aio-pika>=9.4.0",
    "redis>=5.0.0",
    # --- File Handling ---
    "python-multipart>=0.0.9",
    "Pillow>=10.4.0",
    # --- AWS & S3 ---
    "aioboto3==13.1.1",
    "types-aioboto3[s3]",
    # --- Notifications ---
    "sib-api-v3-sdk>=7.6.0",
    "firebase-admin==6.5.0",
    "jinja2>=3.1.0",
    # --- Logging ---
    "python-json-logger>=3.0",
    "sentry-sdk[fastapi]>=2.0.0",
    # --- Validation & Utilities ---
    "email-validator>=2.0.0",
    "phonenumbers==8.13.48",
    "tenacity==8.5.0",
    # --- Admin Interface ---
    "sqladmin==0.16.1",
    # --- Calendar Export ---
    "icalendar>=5.0.0",
    # --- AI Analysis ---
    "groq>=0.4.0",
    # --- Testing ---
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    # --- Dev / CI tools ---
    "ruff==0.15.5",
    "structlog>=25.5.0",
    "prometheus-fastapi-instrumentator>=6.1.0",
    "stripe>=15.0.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 150

[tool.ruff.lint]
select = ["E", "F"]

[tool.ruff.lint.per-file-ignores]
"app/api/v1/api_router.py" = ["F401"]
"app/db/models.py" = ["F401"]
"app/workers/main_worker.py" = ["F401"]
"alembic/env.py" = ["F401"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

