name: Deploy Frontend to EC2

on:
  workflow_run:
    workflows: ["Frontend CI"]
    branches: [main]
    types: [completed]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy frontend on EC2
        uses: appleboy/ssh-action@v1.2.2
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_OWNER: ${{ github.repository_owner }}
          PGBOUNCER_ADMIN_PASSWORD: ${{ secrets.PGBOUNCER_ADMIN_PASSWORD }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          envs: GHCR_USER,GHCR_TOKEN,IMAGE_OWNER,PGBOUNCER_ADMIN_PASSWORD
          script: |
            set -euo pipefail

            DEPLOY_DIR="${DEPLOY_DIR:-$HOME/LinkUp}"
            cd "$DEPLOY_DIR"

            git fetch origin main
            git reset --hard origin/main

            cp backend/.env.production backend/.env
            cp frontend/.env.production frontend/.env

            BACKEND_SECRET="$(grep -E '^SECRET_KEY=' backend/.env | head -1 | cut -d= -f2-)"
            [ -n "$BACKEND_SECRET" ] || { echo "ERROR: SECRET_KEY missing in backend/.env"; exit 1; }

            _sentry_report="$(grep -E '^SENTRY_REPORT_URI=' backend/.env | head -1 | cut -d= -f2-)"
            export SENTRY_REPORT_URI="${_sentry_report:-}"
            [ -n "${SENTRY_REPORT_URI:-}" ] || { echo "ERROR: SENTRY_REPORT_URI missing in backend/.env"; exit 1; }

            command -v envsubst >/dev/null 2>&1 || { echo "ERROR: envsubst missing"; exit 1; }
            envsubst '${SENTRY_REPORT_URI}' < "$DEPLOY_DIR/nginx/nginx.conf.template" \
                   > "$DEPLOY_DIR/nginx/nginx.conf"
            chmod 600 "$DEPLOY_DIR/nginx/nginx.conf"

            COMPOSE="docker compose --env-file backend/.env --env-file frontend/.env"

            OWNER_LOWER="$(echo "$IMAGE_OWNER" | tr '[:upper:]' '[:lower:]')"
            GHCR_BASE="ghcr.io/$OWNER_LOWER/linkup"

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            docker pull "$GHCR_BASE/frontend:latest"

            export FRONTEND_IMAGE="$GHCR_BASE/frontend:latest"

            $COMPOSE --profile prod up -d --no-deps frontend
            $COMPOSE --profile prod up -d --no-deps --force-recreate nginx

            docker exec linkup_frontend wget -qO- http://localhost:80/config.js > /dev/null \
              && echo "Frontend deploy succeeded" \
              || { echo "Frontend smoke check failed"; exit 1; }
