# Optional: build images and roll GKE deployments. Requires GitHub Actions secrets/vars.
# Set: secrets GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT; vars GCP_REGION, GCP_ARTIFACT_REGISTRY, GKE_CLUSTER_NAME.
# Migrations: run manually when schema changes (extract Job from kustomize output or apply migrate manifest with proxy sidecar).
# Trigger: workflow_dispatch only.
name: Deploy to GKE

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag (default: github.sha)"
        required: false
        default: ""

env:
  GCP_REGION: ${{ vars.GCP_REGION }}

jobs:
  build-and-rollout:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    # Skip entire job if not configured (set vars after enabling).
    if: ${{ vars.GCP_ARTIFACT_REGISTRY != '' && secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && secrets.GCP_SERVICE_ACCOUNT != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Set TAG and REGISTRY for later steps
        run: |
          TAG="${{ inputs.image_tag }}"
          if [ -z "$TAG" ]; then TAG="${{ github.sha }}"; fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "REGISTRY=${{ vars.GCP_ARTIFACT_REGISTRY }}" >> "$GITHUB_ENV"

      - name: Build and push images
        run: |
          docker build -t "${REGISTRY}/backend:${TAG}" -t "${REGISTRY}/backend:latest" --target production ./backend
          docker push "${REGISTRY}/backend:${TAG}"
          docker push "${REGISTRY}/backend:latest"
          docker build -t "${REGISTRY}/email-renderer:${TAG}" -t "${REGISTRY}/email-renderer:latest" --target production ./email-renderer
          docker push "${REGISTRY}/email-renderer:${TAG}"
          docker push "${REGISTRY}/email-renderer:latest"
          docker build -t "${REGISTRY}/chat-ws:${TAG}" -t "${REGISTRY}/chat-ws:latest" ./chat-ws
          docker push "${REGISTRY}/chat-ws:${TAG}"
          docker push "${REGISTRY}/chat-ws:latest"
          docker build -t "${REGISTRY}/frontend:${TAG}" -t "${REGISTRY}/frontend:latest" ./frontend
          docker push "${REGISTRY}/frontend:${TAG}"
          docker push "${REGISTRY}/frontend:latest"

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials "${{ vars.GKE_CLUSTER_NAME }}" --region "${GCP_REGION}"

      - name: Rollout new images
        run: |
          kubectl set image deployment/linkup-backend "backend=${REGISTRY}/backend:${TAG}" -n linkup
          kubectl set image deployment/linkup-worker "worker=${REGISTRY}/backend:${TAG}" -n linkup
          kubectl set image deployment/linkup-email-renderer "email-renderer=${REGISTRY}/email-renderer:${TAG}" -n linkup
          kubectl set image deployment/linkup-chat-ws "chat-ws=${REGISTRY}/chat-ws:${TAG}" -n linkup
          kubectl set image deployment/linkup-frontend "frontend=${REGISTRY}/frontend:${TAG}" -n linkup

      - name: Verify rollouts
        run: |
          kubectl rollout status deployment/linkup-backend -n linkup --timeout=300s
          kubectl rollout status deployment/linkup-worker -n linkup --timeout=300s
          kubectl rollout status deployment/linkup-email-renderer -n linkup --timeout=300s
          kubectl rollout status deployment/linkup-chat-ws -n linkup --timeout=300s
          kubectl rollout status deployment/linkup-frontend -n linkup --timeout=300s
