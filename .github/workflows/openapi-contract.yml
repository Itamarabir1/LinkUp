name: OpenAPI Contract

# Single source of truth: app.openapi() in FastAPI.
# This workflow exports a fresh schema, runs Orval, and fails when the
# committed Orval output (frontend/src/api/generated/) drifts from FastAPI.
# The snapshot file (frontend/openapi-snapshot.json) is intentionally
# gitignored — it is a build artifact, never committed.

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/app/**'
      - 'backend/scripts/export_openapi.py'
      - 'backend/pyproject.toml'
      - 'backend/uv.lock'
      - 'frontend/orval.config.ts'
      - 'frontend/src/api/generated/**'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - '.github/workflows/openapi-contract.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/app/**'
      - 'backend/scripts/export_openapi.py'
      - 'backend/pyproject.toml'
      - 'backend/uv.lock'
      - 'frontend/orval.config.ts'
      - 'frontend/src/api/generated/**'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - '.github/workflows/openapi-contract.yml'

concurrency:
  group: openapi-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'

      - name: Install uv (with cache)
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Export OpenAPI schema from FastAPI
        working-directory: backend
        env:
          SECRET_KEY: ci-openapi-export-dummy-key-not-production
        run: uv run python scripts/export_openapi.py --out ../frontend/openapi-snapshot.json

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Regenerate Orval client
        working-directory: frontend
        run: npm run gen:api

      - name: Check for drift in frontend/src/api/generated/
        run: |
          git update-index -q --refresh
          if ! git diff --exit-code -- frontend/src/api/generated/; then
            echo ""
            echo "ERROR: Generated API client is out of sync with FastAPI schema."
            echo ""
            echo "Run from repo root:"
            echo "  make openapi"
            echo "or from frontend/:"
            echo "  npm run openapi:sync"
            echo ""
            echo "Then commit the changes in frontend/src/api/generated/."
            exit 1
          fi
