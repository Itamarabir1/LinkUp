name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'infrastructure/**'
      - 'nginx/**'
      - 'docker-compose.yml'
      - '.github/workflows/backend-ci.yml'
      - '.github/workflows/deploy-ec2.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'infrastructure/**'
      - 'nginx/**'
      - 'docker-compose.yml'
      - '.github/workflows/backend-ci.yml'
      - '.github/workflows/deploy-ec2.yml'

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/test_db
    permissions:
      contents: read
      packages: write
      actions: write

    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check app/

      - name: Format check (ruff)
        run: uv run ruff format --check app/

      - name: Run migrations
        run: uv run alembic upgrade head

      - name: Verify migration head
        run: bash ../scripts/ops/check-migration-head.sh

      - name: Run RabbitMQ reliability tests
        run: uv run pytest tests/infrastructure/test_rabbitmq_reliability.py -v --tb=short

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short

      - name: Login to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Set lowercase owner
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        id: lowercase
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and push backend image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./backend
          target: production
          push: true
          tags: |
            ghcr.io/${{ steps.lowercase.outputs.owner }}/linkup/backend:latest
            ghcr.io/${{ steps.lowercase.outputs.owner }}/linkup/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push worker image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./backend
          target: worker
          push: true
          tags: |
            ghcr.io/${{ steps.lowercase.outputs.owner }}/linkup/worker:latest
            ghcr.io/${{ steps.lowercase.outputs.owner }}/linkup/worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push migrate image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./backend
          target: migrate
          push: true
          tags: |
            ghcr.io/${{ steps.lowercase.outputs.owner }}/linkup/migrate:latest
            ghcr.io/${{ steps.lowercase.outputs.owner }}/linkup/migrate:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push pgbouncer image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./infrastructure/pgbouncer
          push: true
          tags: |
            ghcr.io/${{ steps.lowercase.outputs.owner }}/linkup/pgbouncer:latest
            ghcr.io/${{ steps.lowercase.outputs.owner }}/linkup/pgbouncer:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max