name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'infrastructure/**'
      - 'docker-compose.yml'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'infrastructure/**'
      - 'docker-compose.yml'
      - '.github/workflows/backend-ci.yml'

defaults:
  run:
    working-directory: backend

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/test_db
    permissions:
      contents: read
      packages: write

    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check app/

      - name: Format check (ruff)
        run: uv run ruff format --check app/

      - name: Run migrations
        run: uv run alembic upgrade head

      - name: Verify migration head
        run: bash ../scripts/ops/check-migration-head.sh

      - name: Run RabbitMQ reliability tests
        run: uv run pytest tests/infrastructure/test_rabbitmq_reliability.py -v --tb=short

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short

      - name: Login to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase owner
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        id: lowercase
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and push backend image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: production
          push: true
          tags: |
            ghcr.io/${{ steps.lowercase.outputs.owner }}/linkup/backend:latest
            ghcr.io/${{ steps.lowercase.outputs.owner }}/linkup/backend:${{ github.sha }}

      - name: Build and push worker image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: worker
          push: true
          tags: |
            ghcr.io/${{ steps.lowercase.outputs.owner }}/linkup/worker:latest
            ghcr.io/${{ steps.lowercase.outputs.owner }}/linkup/worker:${{ github.sha }}

      - name: Build and push migrate image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: migrate
          push: true
          tags: |
            ghcr.io/${{ steps.lowercase.outputs.owner }}/linkup/migrate:latest
            ghcr.io/${{ steps.lowercase.outputs.owner }}/linkup/migrate:${{ github.sha }}

      - name: Build and push pgbouncer image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ./infrastructure/pgbouncer
          push: true
          tags: |
            ghcr.io/${{ steps.lowercase.outputs.owner }}/linkup/pgbouncer:latest
            ghcr.io/${{ steps.lowercase.outputs.owner }}/linkup/pgbouncer:${{ github.sha }}

  deploy-ec2:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: lint-and-test
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy backend on EC2 (rolling single-instance)
        uses: appleboy/ssh-action@v1.2.2
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_OWNER: ${{ github.repository_owner }}
          IMAGE_TAG: ${{ github.sha }}
          PGBOUNCER_ADMIN_PASSWORD: ${{ secrets.PGBOUNCER_ADMIN_PASSWORD }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          envs: GHCR_USER,GHCR_TOKEN,IMAGE_OWNER,IMAGE_TAG,PGBOUNCER_ADMIN_PASSWORD
          script: |
            set -euo pipefail

            DEPLOY_DIR="${DEPLOY_DIR:-$HOME/LinkUp}"
            STATE_DIR="$DEPLOY_DIR/.deploy_state"
            PREV_TAG_FILE="$STATE_DIR/backend_prev_tag"
            mkdir -p "$STATE_DIR"

            cd "$DEPLOY_DIR"
            git pull origin main

            # Env files: each <svc>/.env.production lives on EC2 (gitignored).
            # frontend/.env.production must contain VITE_* + APP_ENV — they are
            # interpolated into docker-compose.yml's frontend env block, then the
            # nginx entrypoint envsubsts them into /usr/share/nginx/html/config.js.
            # Public values only (Firebase Web, Stripe publishable, Sentry DSN, Map ID).
            cp backend/.env.production backend/.env
            cp chat-ws/.env.production chat-ws/.env
            # Ensure JWT_SECRET in chat-ws matches SECRET_KEY in backend (single source of truth)
            BACKEND_SECRET="$(grep -E '^SECRET_KEY=' backend/.env | head -1 | cut -d= -f2-)"
            sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$BACKEND_SECRET|" chat-ws/.env
            [ -n "$BACKEND_SECRET" ] || { echo "ERROR: SECRET_KEY missing in backend/.env"; exit 1; }
            cp frontend/.env.production frontend/.env

            [ -f backend/.env ]  || { echo "ERROR: backend/.env missing on EC2";  exit 1; }
            [ -f frontend/.env ] || { echo "ERROR: frontend/.env missing on EC2 (need frontend/.env.production)"; exit 1; }

            # Two env-files: later overrides earlier. backend has the infra creds;
            # frontend supplies VITE_* without polluting the backend namespace.
            COMPOSE="docker compose --env-file backend/.env --env-file frontend/.env"

            POSTGRES_USER="$(grep -E '^POSTGRES_USER=' backend/.env | head -1 | cut -d= -f2-)"
            POSTGRES_PASSWORD="$(grep -E '^POSTGRES_PASSWORD=' backend/.env | head -1 | cut -d= -f2-)"
            export POSTGRES_USER POSTGRES_PASSWORD

            [ -n "${POSTGRES_USER:-}" ]            || { echo "ERROR: POSTGRES_USER missing";          exit 1; }
            [ -n "${POSTGRES_PASSWORD:-}" ]        || { echo "ERROR: POSTGRES_PASSWORD missing";      exit 1; }
            [ -n "${PGBOUNCER_ADMIN_PASSWORD:-}" ] || { echo "ERROR: PGBOUNCER_ADMIN_PASSWORD missing"; exit 1; }

            command -v envsubst >/dev/null 2>&1 || { echo "ERROR: envsubst missing"; exit 1; }
            envsubst < "$DEPLOY_DIR/infrastructure/pgbouncer/userlist.txt.template" \
                   > "$DEPLOY_DIR/infrastructure/pgbouncer/userlist.txt"
            chmod 644 "$DEPLOY_DIR/infrastructure/pgbouncer/userlist.txt"

            OWNER_LOWER="$(echo "$IMAGE_OWNER" | tr '[:upper:]' '[:lower:]')"
            GHCR_BASE="ghcr.io/$OWNER_LOWER/linkup"
            NEW_IMAGE="$GHCR_BASE/backend:$IMAGE_TAG"
            PREV_TAG="latest"
            [ -f "$PREV_TAG_FILE" ] && PREV_TAG="$(cat "$PREV_TAG_FILE")"
            PREV_IMAGE="$GHCR_BASE/backend:$PREV_TAG"

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            docker image prune -af

            docker pull "$NEW_IMAGE"
            docker pull "$PREV_IMAGE"                                || true
            docker pull "$GHCR_BASE/pgbouncer:latest"
            docker pull "$GHCR_BASE/worker:latest"
            docker pull "$GHCR_BASE/migrate:latest"
            docker pull "$GHCR_BASE/chat-ws:latest"                  || true
            docker pull "$GHCR_BASE/frontend:latest"                 || true
            docker pull "ghcr.io/$OWNER_LOWER/linkup-email-renderer:latest" || true

            export PGBOUNCER_IMAGE="$GHCR_BASE/pgbouncer:latest"
            export WORKER_IMAGE="$GHCR_BASE/worker:latest"
            export MIGRATE_IMAGE="$GHCR_BASE/migrate:latest"
            export CHAT_WS_IMAGE="$GHCR_BASE/chat-ws:latest"
            export FRONTEND_IMAGE="$GHCR_BASE/frontend:latest"
            export EMAIL_RENDERER_IMAGE="ghcr.io/$OWNER_LOWER/linkup-email-renderer:latest"

            $COMPOSE --profile prod up -d --wait --wait-timeout 120 \
              db redis-primary redis-replica redis-sentinel rabbitmq

            $COMPOSE up -d --wait --wait-timeout 60 --no-deps pgbouncer

            $COMPOSE run --rm migrate

            $COMPOSE up -d --no-deps email-renderer
            $COMPOSE up -d --no-deps notification-worker task-worker ai-worker
            $COMPOSE up -d --no-deps chat-ws
            $COMPOSE --profile prod up -d --no-deps frontend nginx
            $COMPOSE --profile prod up -d --no-deps --force-recreate nginx

            if BACKEND_IMAGE="$NEW_IMAGE" $COMPOSE up -d --no-deps --wait --wait-timeout 90 backend; then
              echo "$IMAGE_TAG" > "$PREV_TAG_FILE"
              echo "Deploy succeeded: $NEW_IMAGE"
              exit 0
            fi

            echo "Health check failed, rolling back to $PREV_IMAGE"
            if BACKEND_IMAGE="$PREV_IMAGE" $COMPOSE up -d --no-deps --wait --wait-timeout 90 backend; then
              echo "Rollback succeeded"
              exit 1
            fi

            echo "Rollback failed - manual intervention required"
            exit 1