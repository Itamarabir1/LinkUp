# Kubernetes ServiceAccount used by pods that run the Cloud SQL Auth Proxy sidecar.
# Bind Workload Identity: map this KSA to a GCP service account with roles/cloudsql.client
# (see k8s/overlays/gke-prod/README.md).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: linkup-cloudsql
  namespace: linkup
