# JSON6902: add Cloud SQL proxy sidecar + SA to migrate Job (strategic merge is unreliable for Job).
- op: add
  path: /spec/template/spec/serviceAccountName
  value: linkup-cloudsql
- op: add
  path: /spec/template/spec/containers/-
  value:
    name: cloud-sql-proxy
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.2
    args:
      - "--structured-logs"
      - "--port=5432"
      - "REPLACE_ME_PROJECT:europe-west1:REPLACE_ME_INSTANCE"
    securityContext:
      runAsNonRoot: true
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "256Mi"
        cpu: "200m"
