apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkup-chat-ws
  labels:
    app: linkup-chat-ws
spec:
  replicas: 1
  selector:
    matchLabels:
      app: linkup-chat-ws
  template:
    metadata:
      labels:
        app: linkup-chat-ws
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: chat-ws
          image: ghcr.io/Itamarabir1/linkup-chat-ws:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
          env:
            - name: PORT
              value: "8081"
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: linkup-chat-ws-secret
                  key: REDIS_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: linkup-chat-ws-secret
                  key: JWT_SECRET
            - name: BACKEND_URL
              value: "http://linkup-backend:8000"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          livenessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
