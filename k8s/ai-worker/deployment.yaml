apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkup-ai-worker
  labels:
    app: linkup-ai-worker
  annotations:
    app.kubernetes.io/version: "latest"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: linkup-ai-worker
  template:
    metadata:
      labels:
        app: linkup-ai-worker
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: ai-worker
          image: ghcr.io/Itamarabir1/linkup-backend:latest
          imagePullPolicy: Always
          command: ["python", "-m", "app.workers.ai_worker"]
          envFrom:
            - configMapRef:
                name: linkup-backend-config
          env:
            - name: DATABASE_URL_RAW
              valueFrom:
                secretKeyRef:
                  name: linkup-backend-secret
                  key: DATABASE_URL
            - name: REDIS_URL_RAW
              valueFrom:
                secretKeyRef:
                  name: linkup-backend-secret
                  key: REDIS_URL
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: linkup-backend-secret
                  key: SECRET_KEY
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: linkup-redis-secret
                  key: password
            - name: REDIS_CHAT_DB
              value: "1"
            - name: DB_POOL_SIZE
              value: "2"
            - name: DB_MAX_OVERFLOW
              value: "3"
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            exec:
              command: ["sh", "-c", "kill -0 1"]
            initialDelaySeconds: 30
            periodSeconds: 60
