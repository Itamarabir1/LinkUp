apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkup-worker
  labels:
    app: linkup-worker
  annotations:
    app.kubernetes.io/version: "latest"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: linkup-worker
  template:
    metadata:
      labels:
        app: linkup-worker
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: worker
          image: ghcr.io/Itamarabir1/linkup-backend:latest
          imagePullPolicy: Always
          command: ["python", "-m", "app.workers.main_worker"]
          envFrom:
            - configMapRef:
                name: linkup-backend-config
          env:
            # Explicit: outbox-worker listens on chat completion on Redis DB 1 (see docker-compose.yml)
            - name: REDIS_CHAT_DB
              value: "1"
            - name: DATABASE_URL_RAW
              valueFrom:
                secretKeyRef:
                  name: linkup-backend-secret
                  key: DATABASE_URL
            - name: REDIS_URL_RAW
              valueFrom:
                secretKeyRef:
                  name: linkup-backend-secret
                  key: REDIS_URL
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: linkup-backend-secret
                  key: SECRET_KEY
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: linkup-backend-secret
                  key: RABBITMQ_PASSWORD
            - name: BREVO_API_KEY
              valueFrom:
                secretKeyRef:
                  name: linkup-backend-secret
                  key: BREVO_API_KEY
            - name: GOOGLE_MAPS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: linkup-backend-secret
                  key: GOOGLE_MAPS_API_KEY
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: linkup-backend-secret
                  key: GOOGLE_CLIENT_ID
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: linkup-backend-secret
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: linkup-backend-secret
                  key: AWS_SECRET_ACCESS_KEY
            - name: FIREBASE_CREDENTIALS_JSON
              valueFrom:
                secretKeyRef:
                  name: linkup-backend-secret
                  key: FIREBASE_CREDENTIALS_JSON
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: linkup-redis-secret
                  key: password
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            exec:
              command: ["sh", "-c", "kill -0 1"]
            initialDelaySeconds: 30
            periodSeconds: 60
