apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkup-email-renderer
  labels:
    app: linkup-email-renderer
  annotations:
    app.kubernetes.io/version: "latest"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: linkup-email-renderer
  template:
    metadata:
      labels:
        app: linkup-email-renderer
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: email-renderer
          image: ghcr.io/Itamarabir1/linkup-email-renderer:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: NODE_ENV
              value: "production"
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "300m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
