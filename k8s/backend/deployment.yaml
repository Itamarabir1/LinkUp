apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkup-backend
  labels:
    app: linkup-backend
  annotations:
    app.kubernetes.io/version: "latest"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: linkup-backend
  template:
    metadata:
      labels:
        app: linkup-backend
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: backend
          image: ghcr.io/Itamarabir1/linkup-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          # Non-secret app config: envFrom loads all keys from linkup-backend-config (see configmap.yaml).
          # Secrets stay as explicit secretKeyRef below so rotation/ACL stay separate from ConfigMap.
          envFrom:
            - configMapRef:
                name: linkup-backend-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: linkup-backend-secret
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: linkup-backend-secret
                  key: REDIS_URL
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: linkup-backend-secret
                  key: SECRET_KEY
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: linkup-backend-secret
                  key: RABBITMQ_PASSWORD
            - name: BREVO_API_KEY
              valueFrom:
                secretKeyRef:
                  name: linkup-backend-secret
                  key: BREVO_API_KEY
            - name: GOOGLE_MAPS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: linkup-backend-secret
                  key: GOOGLE_MAPS_API_KEY
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: linkup-backend-secret
                  key: GOOGLE_CLIENT_ID
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: linkup-backend-secret
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: linkup-backend-secret
                  key: AWS_SECRET_ACCESS_KEY
            - name: FIREBASE_CREDENTIALS_JSON
              valueFrom:
                secretKeyRef:
                  name: linkup-backend-secret
                  key: FIREBASE_CREDENTIALS_JSON
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
