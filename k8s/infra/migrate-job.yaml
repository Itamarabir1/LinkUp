# Run once before backend/worker after DB is up: kubectl apply -f migrate-job.yaml
# Uses same DB secret as backend; Settings reads DATABASE_URL_RAW (see app/core/config.py).
apiVersion: batch/v1
kind: Job
metadata:
  name: linkup-migrate
  namespace: linkup
  labels:
    app: linkup-migrate
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: linkup-migrate
    spec:
      restartPolicy: OnFailure
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: migrate
          image: ghcr.io/Itamarabir1/linkup-backend:latest
          imagePullPolicy: Always
          workingDir: /app
          command: ["alembic", "upgrade", "head"]
          env:
            - name: DATABASE_URL_RAW
              valueFrom:
                secretKeyRef:
                  name: linkup-backend-secret
                  key: DATABASE_URL
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
