apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkup-redis
  labels:
    app: linkup-redis
  annotations:
    app.kubernetes.io/version: "latest"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: linkup-redis
  template:
    metadata:
      labels:
        app: linkup-redis
    spec:
      containers:
        - name: redis
          image: redis/redis-stack:7.2.0-v10
          command:
            - sh
            - -c
            - "redis-server --requirepass $$REDIS_PASSWORD"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: linkup-redis-secret
                  key: password
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: redis-data
              mountPath: /data
          livenessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a $REDIS_PASSWORD ping"]
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a $REDIS_PASSWORD ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: linkup-redis-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: linkup-redis-pvc
  labels:
    app: linkup-redis
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: linkup-redis
  labels:
    app: linkup-redis
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
      name: redis
  selector:
    app: linkup-redis
